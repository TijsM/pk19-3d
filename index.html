<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pieter Kleijnstraat 19 — 3D renovation</title>
<style>
  :root { --bg: rgba(22, 24, 28, 0.86); --fg: #f2efe9; --mut: #a9a59c; --acc: #e0892f; --acc2: #4fa3a5; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfd8dc; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; color: var(--fg); }
  #app { position: fixed; inset: 0; }
  .panel { position: fixed; background: var(--bg); backdrop-filter: blur(8px); border-radius: 12px; padding: 12px 14px; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
  #left { top: 14px; left: 14px; width: 250px; }
  #left h1 { font-size: 15px; margin: 0 0 2px; }
  #left .sub { color: var(--mut); font-size: 12px; margin-bottom: 10px; }
  .row { margin: 9px 0 4px; color: var(--mut); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .seg { display: flex; background: rgba(255,255,255,.08); border-radius: 8px; padding: 2px; gap: 2px; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--fg); padding: 6px 4px; border-radius: 6px; cursor: pointer; font: inherit; }
  .seg button.on { background: var(--fg); color: #1b1c1f; font-weight: 600; }
  .seg.variant button.on[data-v="new"] { background: var(--acc); color: #fff; }
  label.chk { display: flex; gap: 8px; align-items: center; margin-top: 8px; cursor: pointer; }
  #right { top: 14px; right: 14px; width: 300px; max-height: calc(100% - 28px); overflow-y: auto; }
  #right h2 { font-size: 13px; margin: 0 0 8px; }
  .item { display: flex; gap: 9px; align-items: flex-start; padding: 7px 6px; border-radius: 8px; cursor: pointer; }
  .item:hover, .item.on { background: rgba(255,255,255,.09); }
  .num { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--acc); color: #fff; font-weight: 700; display: grid; place-items: center; font-size: 12px; }
  .item .t { font-weight: 600; }
  .item .f { color: var(--mut); font-size: 11px; }
  #card { margin-top: 10px; border-top: 1px solid rgba(255,255,255,.12); padding-top: 10px; display: none; }
  #card h3 { margin: 0 0 6px; font-size: 14px; }
  #card p { margin: 0 0 8px; color: #dcd8d0; }
  #card ul { margin: 0 0 8px; padding-left: 18px; color: #dcd8d0; }
  #card .q { color: #f0c38e; }
  .thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin: 6px 0 8px; }
  .thumbs img { width: 100%; aspect-ratio: 3/2; object-fit: cover; border-radius: 4px; cursor: zoom-in; }
  .btn { border: 0; background: var(--acc2); color: #fff; padding: 6px 10px; border-radius: 6px; cursor: pointer; font: inherit; font-weight: 600; margin-right: 6px; }
  .btn.ghost { background: rgba(255,255,255,.12); }
  #help { bottom: 14px; left: 50%; transform: translateX(-50%); padding: 8px 14px; color: #dcd8d0; font-size: 12px; white-space: nowrap; }
  #help b { color: #fff; }
  #hud { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); padding: 6px 14px; display: none; font-weight: 600; }
  #cross { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(255,255,255,.85); box-shadow: 0 0 0 1px rgba(0,0,0,.4); display: none; pointer-events: none; }
  #start { position: fixed; inset: 0; display: none; place-items: center; background: rgba(0,0,0,.35); cursor: pointer; }
  #start div { background: var(--bg); padding: 18px 22px; border-radius: 12px; text-align: center; }
  #start h3 { margin: 0 0 6px; }
  .lbl { font: 600 11px/1.2 -apple-system, sans-serif; color: #1d1f22; background: rgba(255,255,255,.82); padding: 2px 6px; border-radius: 4px; white-space: nowrap; pointer-events: none; }
  .lbl.new { background: rgba(224,137,47,.92); color: #fff; }
  .hs { width: 24px; height: 24px; border-radius: 50%; background: var(--acc); color: #fff; font: 700 12px/24px sans-serif; text-align: center; cursor: pointer; box-shadow: 0 0 0 3px rgba(255,255,255,.75), 0 2px 8px rgba(0,0,0,.35); }
  .hs:hover { transform: scale(1.15); }
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; place-items: center; z-index: 20; cursor: zoom-out; }
  #lightbox img { max-width: 92vw; max-height: 88vh; border-radius: 6px; }
  #lightbox .cap { position: fixed; bottom: 18px; left: 0; right: 0; text-align: center; color: #ddd; }
  #plans { display: flex; flex-wrap: wrap; gap: 6px; }
  #plans a { color: var(--fg); background: rgba(255,255,255,.1); padding: 4px 8px; border-radius: 6px; text-decoration: none; font-size: 12px; cursor: pointer; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #333; font-size: 15px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="loading">Loading 3D model…</div>
<div id="app"></div>

<div id="left" class="panel">
  <h1>Pieter Kleijnstraat 19</h1>
  <div class="sub">Rosmalen · interactive renovation model</div>
  <div class="row">State</div>
  <div class="seg variant" id="segVariant">
    <button data-v="cur">Current</button>
    <button data-v="new" class="on">Renovated</button>
  </div>
  <div class="row">View</div>
  <div class="seg" id="segMode">
    <button data-m="orbit" class="on">Dollhouse</button>
    <button data-m="walk">Walk through</button>
  </div>
  <div class="row">Floor</div>
  <div class="seg" id="segFloor">
    <button data-f="all">House</button>
    <button data-f="g" class="on">Ground</button>
    <button data-f="f1">1st</button>
    <button data-f="f2">Attic</button>
  </div>
  <label class="chk"><input type="checkbox" id="chkFurn" checked /> Furniture</label>
  <label class="chk"><input type="checkbox" id="chkLabels" checked /> Room labels</label>
  <div class="row">Plans (from Notion)</div>
  <div id="plans"></div>
</div>

<div id="right" class="panel">
  <h2>Renovation works</h2>
  <div id="list"></div>
  <div id="card"></div>
</div>

<div id="help" class="panel"></div>
<div id="hud" class="panel"></div>
<div id="cross"></div>
<div id="start"><div><h3>Click to walk</h3><b>W A S D</b> move · <b>mouse</b> look · <b>Shift</b> run<br/><b>1 2 3</b> jump to floor · <b>R</b> current/renovated · <b>Esc</b> release mouse</div></div>
<div id="lightbox"><img alt="" /><div class="cap"></div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ---------------------------------------------------------------- constants
// World units are metres. x runs left→right as drawn on the plans, z runs from the
// garden facade (z = 0, kitchen back wall) to the street facade (z ≈ 10.95).
// The first floor and attic start 3.27 m further toward the street (the kitchen is an extension).
const GH = 2.6, F1 = 2.9, F1H = 2.6, F2 = 5.8, F2H = 2.45, OFF = 3.27;
const Z1 = (z) => z + OFF;

const S = { variant: 'new', floor: 'g', mode: 'orbit', furn: true, labels: true };

// ---------------------------------------------------------------- renderer / scene
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
app.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none' });
app.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfdde4);
scene.fog = new THREE.Fog(0xcfdde4, 45, 110);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.05, 300);
camera.position.set(-7, 14, 19);

scene.add(new THREE.HemisphereLight(0xffffff, 0x9c8f7c, 1.25));
scene.add(new THREE.AmbientLight(0xffffff, 0.45));
const sun = new THREE.DirectionalLight(0xfff1dc, 2.2);
sun.position.set(-12, 22, -8);
sun.target.position.set(3, 0, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 70 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);

// ---------------------------------------------------------------- textures
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const hsl = (h, s, l) => `hsl(${h},${s}%,${l}%)`;
// 1.2 m × 1.2 m of floor boards
function planks(h, s, l) {
  return canvasTex(1024, 1024, (g, w) => {
    const rows = 6, rh = w / rows;
    for (let r = 0; r < rows; r++) {
      let x = -rnd() * 400;
      while (x < w) {
        const len = 500 + rnd() * 450, dl = (rnd() - 0.5) * 9;
        g.fillStyle = hsl(h + (rnd() - .5) * 4, s, l + dl); g.fillRect(x, r * rh, len, rh);
        for (let k = 0; k < 14; k++) { g.strokeStyle = `rgba(60,35,15,${0.04 + rnd() * 0.06})`; g.lineWidth = 1 + rnd() * 2; const yy = r * rh + rnd() * rh; g.beginPath(); g.moveTo(x, yy); g.bezierCurveTo(x + len * .3, yy + (rnd() - .5) * 10, x + len * .6, yy + (rnd() - .5) * 10, x + len, yy); g.stroke(); }
        g.fillStyle = 'rgba(40,25,10,.35)'; g.fillRect(x, r * rh, 2, rh);
        x += len;
      }
      g.fillStyle = 'rgba(40,25,10,.4)'; g.fillRect(0, r * rh, w, 2);
    }
  });
}
// 1 m × 1 m of brick (Dutch red-brown)
const brickTex = canvasTex(512, 512, (g, w) => {
  g.fillStyle = '#b9ab98'; g.fillRect(0, 0, w, w);
  const ch = w / 16, bw = w / 4.6;
  for (let r = 0; r < 16; r++) for (let x = (r % 2) * -bw / 2; x < w; x += bw) {
    g.fillStyle = hsl(14 + rnd() * 8, 38 + rnd() * 14, 28 + rnd() * 10); g.fillRect(x + 2, r * ch + 2, bw - 4, ch - 4);
  }
});
function tileTex(color, cols, rows, grout = 'rgba(0,0,0,.18)', jitter = 4) {
  return canvasTex(512, 512, (g, w, h) => {
    const tw = w / cols, th = h / rows;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const col = new THREE.Color(color).offsetHSL(0, 0, (rnd() - .5) * jitter / 100);
      g.fillStyle = '#' + col.getHexString(); g.fillRect(c * tw, r * th, tw, th);
    }
    g.strokeStyle = grout; g.lineWidth = 3;
    for (let c = 0; c <= cols; c++) { g.beginPath(); g.moveTo(c * tw, 0); g.lineTo(c * tw, h); g.stroke(); }
    for (let r = 0; r <= rows; r++) { g.beginPath(); g.moveTo(0, r * th); g.lineTo(w, r * th); g.stroke(); }
  });
}
function paddedTex(color) {
  return canvasTex(512, 512, (g, w) => {
    const n = 2, s = w / n;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      const gr = g.createRadialGradient(i * s + s / 2, j * s + s / 2, s * .1, i * s + s / 2, j * s + s / 2, s * .72);
      const c = new THREE.Color(color);
      gr.addColorStop(0, '#' + c.clone().offsetHSL(0, 0, .08).getHexString()); gr.addColorStop(1, '#' + c.clone().offsetHSL(0, 0, -.12).getHexString());
      g.fillStyle = gr; g.fillRect(i * s, j * s, s, s);
      g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 4; g.strokeRect(i * s + 2, j * s + 2, s - 4, s - 4);
    }
  });
}
const damaskTex = canvasTex(256, 256, (g, w) => {
  g.fillStyle = '#4a4a4c'; g.fillRect(0, 0, w, w);
  g.strokeStyle = 'rgba(220,220,220,.55)'; g.lineWidth = 3;
  for (const [cx, cy] of [[64, 64], [192, 192], [192, 64], [64, 192]]) {
    g.beginPath(); g.ellipse(cx, cy, 28, 44, 0, 0, Math.PI * 2); g.stroke();
    g.beginPath(); g.ellipse(cx, cy, 12, 22, 0, 0, Math.PI * 2); g.stroke();
  }
});
const loader = new THREE.TextureLoader();
const imgTex = (url) => { const t = loader.load(url); t.colorSpace = THREE.SRGBColorSpace; return t; };

// ---------------------------------------------------------------- materials
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.85, ...o });
const texMat = (tex, rx, ry, o = {}) => { const t = tex.clone(); t.repeat.set(rx, ry); t.needsUpdate = true; return new THREE.MeshStandardMaterial({ map: t, roughness: 0.8, ...o }); };
const T = {
  oak: planks(30, 45, 52), oakLight: planks(36, 38, 70), brick: brickTex,
  tileGrey: tileTex('#bdb9b2', 2, 4), tileFloor: tileTex('#8f8c88', 2, 2), tileWhite: tileTex('#f2efe8', 8, 16, 'rgba(0,0,0,.12)', 6),
  tileSage: tileTex('#7d9686', 8, 16, 'rgba(255,255,255,.35)', 10), tileDark: tileTex('#3e3f42', 4, 8, 'rgba(255,255,255,.1)'),
  paddedOrange: paddedTex('#b98250'), paddedRed: paddedTex('#b51f45'),
  tiger: imgTex('tex/tiger.jpg'), coffee: imgTex('tex/coffee.jpg'),
};
const M = {
  paint: std(0xf0ebe2), ceiling: std(0xf7f5f0), trim: std(0xffffff, { roughness: 0.5 }),
  mint: std(0xcfe0d6), ochre: std(0xe7c58f),
  brick: (rx, ry) => texMat(T.brick, rx, ry), clad: std(0x3a3e44), cladLight: std(0x9ea4a9),
  roof: std(0x4c3830), roofFlat: std(0x55585c, { roughness: 1 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xd9eef5, transparent: true, opacity: 0.22, roughness: 0.05, metalness: 0, depthWrite: false }),
  carpet: std(0x4b4c50, { roughness: 1 }), cabinet: std(0xf4f2ec, { roughness: 0.6 }), counter: std(0x2b2b2e, { roughness: 0.45 }),
  steel: std(0xc9ccce, { metalness: 0.25, roughness: 0.35 }), black: std(0x1d1d1f, { roughness: 0.5 }), screen: std(0x0d0d10, { roughness: 0.2 }),
  oakSolid: std(0xa87a4f), walnut: std(0x5e412c), whiteWood: std(0xf3f0e8, { roughness: 0.7 }),
  sofaBeige: std(0xcbb69d, { roughness: 1 }), sofaGrey: std(0x8e9196, { roughness: 1 }), sofaGreen: std(0x7e8f77, { roughness: 1 }),
  bedLinen: std(0xf3efe7, { roughness: 1 }), duvetRose: std(0xc9a08a, { roughness: 1 }), duvetGrey: std(0x76797e, { roughness: 1 }), bedFrame: std(0x2e2f33),
  leather: std(0xb07a4f, { roughness: 0.7 }), metalBlack: std(0x2a2a2c, { metalness: 0.5, roughness: 0.5 }),
  porcelain: std(0xfafafa, { roughness: 0.25 }), redWall: std(0xb3253f), wineFridge: std(0x1a1d22, { roughness: 0.15, metalness: 0.3 }),
  plant: std(0x4f7a3e), pot: std(0xcfc5b6), grass: std(0x6c9650), paving: std(0xb8b2a7), street: std(0x77787a), fence: std(0x2f2a27), shed: std(0x34302c),
  neighbor: new THREE.MeshStandardMaterial({ color: 0xe8e4dc, transparent: true, opacity: 0.35, depthWrite: false }),
  hearth: std(0x26272a), pax: std(0xf6f5f1, { roughness: 0.6 }), door: std(0xfbfbf8, { roughness: 0.55 }),
};
const floorMat = (tex, w, d, scale = 1.2) => texMat(tex, w / scale, d / scale);
// Living-room walls and kitchen fronts change colour with the current/renovated toggle.
M.living = std(0xf0ebe2); M.kitchenCab = std(0xf4f2ec, { roughness: 0.6 });
const PALETTE = { cur: { living: 0xf0ebe2, kitchenCab: 0xf4f2ec }, new: { living: 0xbcb2a2, kitchenCab: 0xe9e0ce } };
function applyPalette() { const p = PALETTE[S.variant]; M.living.color.set(p.living); M.kitchenCab.color.set(p.kitchenCab); }
M.creamWall = std(0xefe6d6); M.oakTop = std(0x9a6a42, { roughness: 0.5 }); M.boucle = std(0xddd3c2, { roughness: 1 });
M.brass = std(0xb58c4c, { metalness: 0.8, roughness: 0.3 }); M.antique = std(0x6e4228, { roughness: 0.6 });
M.walnutTable = std(0x5c3b25, { roughness: 0.55 }); M.olivePillow = std(0x5b6640, { roughness: 1 }); M.rustPillow = std(0x9a5532, { roughness: 1 });
M.lantern = std(0xfff4e0, { emissive: 0xffd9a0, emissiveIntensity: 0.9, roughness: 1 });
const beadTex = canvasTex(256, 256, (g, w) => { g.fillStyle = '#5f6b47'; g.fillRect(0, 0, w, w); for (let x = 0; x < w; x += 16) { g.fillStyle = 'rgba(0,0,0,.28)'; g.fillRect(x, 0, 2, w); g.fillStyle = 'rgba(255,255,255,.07)'; g.fillRect(x + 2, 0, 3, w); } });
const rugTex = canvasTex(1024, 1024, (g, w) => {
  g.fillStyle = '#d9c7a6'; g.fillRect(0, 0, w, w);
  for (const [x, y, rx, ry, c] of [[180, 160, 210, 120, '#8a7b52'], [620, 120, 260, 110, '#9a7650'], [900, 420, 200, 150, '#7f7a4e'], [330, 520, 280, 140, '#a07a52'],
    [700, 700, 240, 130, '#8a7b52'], [150, 860, 220, 120, '#7f7a4e'], [520, 930, 200, 90, '#9a7650']]) { g.fillStyle = c; g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.fill(); }
  for (let i = 0; i < 9000; i++) { g.fillStyle = `rgba(255,255,255,${rnd() * 0.06})`; g.fillRect(rnd() * w, rnd() * w, 2, 2); }
});
const artTex = canvasTex(512, 640, (g, w, h) => {
  g.fillStyle = '#e6dccb'; g.fillRect(0, 0, w, h);
  g.lineCap = 'round';
  for (const [x, y, r, lw, c] of [[150, 470, 150, 70, '#4e4a3c'], [330, 320, 190, 60, '#8b6a45'], [330, 320, 100, 40, '#b49a77'], [180, 470, 60, 30, '#6d6a4e']]) { g.strokeStyle = c; g.lineWidth = lw; g.beginPath(); g.arc(x, y, r, Math.PI, 0); g.stroke(); }
  g.fillStyle = '#3c3a33'; g.fillRect(270, 330, 60, 280);
});

// ---------------------------------------------------------------- registry
const reg = [];          // every visible object: userData { level, variant, kind }
const colliders = [];    // { box: Box3, obj }
const surfaces = [];     // walkable: { x1, x2, z1, z2, h(x, z) }
const labels = [];
function add(obj, level, variant = 'both', kind = 'struct', collide = false) {
  obj.userData = { level, variant, kind };
  obj.traverse((o) => { if (o.isMesh) { o.castShadow = o.material !== M.glass && kind !== 'neighbor'; o.receiveShadow = true; } });
  scene.add(obj); reg.push(obj);
  if (collide) { obj.updateMatrixWorld(true); colliders.push({ box: new THREE.Box3().setFromObject(obj), obj }); }
  return obj;
}
function box(x1, x2, y1, y2, z1, z2, mat, level, variant = 'both', o = {}) {
  const [ax, bx] = [Math.min(x1, x2), Math.max(x1, x2)], [ay, by] = [Math.min(y1, y2), Math.max(y1, y2)], [az, bz] = [Math.min(z1, z2), Math.max(z1, z2)];
  const m = new THREE.Mesh(new THREE.BoxGeometry(bx - ax, by - ay, bz - az), typeof mat === 'function' ? mat(bx - ax, bz - az, by - ay) : mat);
  m.position.set((ax + bx) / 2, (ay + by) / 2, (az + bz) / 2);
  return add(m, level, variant, o.kind || 'struct', o.collide);
}
const furn = (x1, x2, y1, y2, z1, z2, mat, level, variant = 'both', collide = true) => box(x1, x2, y1, y2, z1, z2, mat, level, variant, { kind: 'furn', collide });
function plane(face, at, a1, a2, y1, y2, mat, level, variant = 'both', kind = 'struct') {
  const g = new THREE.PlaneGeometry(a2 - a1, y2 - y1);
  const m = new THREE.Mesh(g, mat);
  const am = (a1 + a2) / 2, ym = (y1 + y2) / 2;
  if (face === '+x') { m.rotation.y = Math.PI / 2; m.position.set(at, ym, am); }
  if (face === '-x') { m.rotation.y = -Math.PI / 2; m.position.set(at, ym, am); }
  if (face === '+z') { m.position.set(am, ym, at); }
  if (face === '-z') { m.rotation.y = Math.PI; m.position.set(am, ym, at); }
  return add(m, level, variant, kind);
}
function surface(x1, x2, z1, z2, h) { surfaces.push({ x1, x2, z1, z2, h: typeof h === 'number' ? () => h : h }); }

// Wall along `axis` from a1 to a2, occupying c1..c2 across, from y0 up to y0+h.
// ops: { a, b, bottom, top, glass?: true|'slider', door?: { hinge: 'a'|'b', side: 1|-1 } }
// o.hFn(a) clips the wall height (used under the attic roof slopes).

// ================================================================ walk mode
const walk = new PointerLockControls(camera, document.body);
const P = { x: 4.4, z: 12.6, feet: 0, vy: 0 };
const keys = {};
const R = 0.22;
function blocked(x, z, feet) {
  for (const c of colliders) {
    if (!c.obj.visible) continue;
    const b = c.box;
    if (b.max.y < feet + 0.32 || b.min.y > feet + 1.75) continue;
    const cx = Math.max(b.min.x, Math.min(x, b.max.x)), cz = Math.max(b.min.z, Math.min(z, b.max.z));
    if ((x - cx) ** 2 + (z - cz) ** 2 < R * R) return true;
  }
  return false;
}
function floorAt(x, z, feet) {
  let best = -1;
  for (const s of surfaces) if (x >= s.x1 && x <= s.x2 && z >= s.z1 && z <= s.z2) { const h = s.h(x, z); if (h <= feet + 0.45 && h > best) best = h; }
  return best;
}
function placeWalker(x, z, feet, lookAt) {
  Object.assign(P, { x, z, feet, vy: 0 });
  camera.position.set(x, feet + 1.62, z);
  if (lookAt) camera.lookAt(lookAt[0], lookAt[1], lookAt[2]);
}
const SPAWN = {

  f1: [3.4, Z1(4.1), F1, [1.5, F1 + 1.5, Z1(4.1)]],

function enterWalk(spawn) {
  S.mode = 'walk'; segSet('segMode', 'm', 'walk');
  orbit.enabled = false; applyVisibility();
  const sp = spawn || [4.4, 12.6, 0, [4.4, 1.6, 9]];

}
function exitWalk() {
  S.mode = 'orbit'; segSet('segMode', 'm', 'orbit'); walk.unlock();

walk.addEventListener('unlock', () => { for (const id of ['left', 'right']) document.getElementById(id).style.display = ''; if (S.mode === 'walk') document.getElementById('start').style.display = 'grid'; document.getElementById('cross').style.display = 'none'; });

addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'KeyR') toggleVariant();
  if (S.mode === 'walk' && ['Digit1', 'Digit2', 'Digit3'].includes(e.code)) { const f = { Digit1: 'g', Digit2: 'f1', Digit3: 'f2' }[e.code]; placeWalker(...SPAWN[f]); segSet('segFloor', 'f', f); }
  if (S.mode === 'orbit' && ['Digit1', 'Digit2', 'Digit3', 'Digit0'].includes(e.code)) setFloor({ Digit0: 'all', Digit1: 'g', Digit2: 'f1', Digit3: 'f2' }[e.code]);
});
addEventListener('keyup', (e) => { keys[e.code] = false; });

function roomAt(x, z, feet) {
  const l = feet > F2 - 0.3 ? 'f2' : feet > F1 - 0.3 ? 'f1' : 'g';
  const r = ROOMS.find((r) => r.l === l && x >= r.x[0] && x <= r.x[1] && z >= r.z[0] && z <= r.z[1]);
  const floorName = { g: 'Gelijkvloers', f1: 'Verdieping 1', f2: 'Zolder' }[l];
  return `${floorName} · ${r ? (S.variant === 'new' && r.nn ? r.nn : r.n) : '—'}`;
}
const fwd = new THREE.Vector3(), rgt = new THREE.Vector3();
function updateWalk(dt) {
  if (walk.isLocked) {
    const sp = (keys.ShiftLeft || keys.ShiftRight ? 3.0 : 1.4) * dt;
    camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize(); rgt.crossVectors(fwd, camera.up).normalize();
    let mx = 0, mz = 0;
    if (keys.KeyW || keys.ArrowUp) { mx += fwd.x; mz += fwd.z; }
    if (keys.KeyS || keys.ArrowDown) { mx -= fwd.x; mz -= fwd.z; }
    if (keys.KeyD || keys.ArrowRight) { mx += rgt.x; mz += rgt.z; }
    if (keys.KeyA || keys.ArrowLeft) { mx -= rgt.x; mz -= rgt.z; }
    const len = Math.hypot(mx, mz);
    if (len > 0) {
      mx = mx / len * sp; mz = mz / len * sp;
      if (!blocked(P.x + mx, P.z, P.feet)) P.x += mx;
      if (!blocked(P.x, P.z + mz, P.feet)) P.z += mz;
    }
  }
  const g = floorAt(P.x, P.z, P.feet);
  if (g >= P.feet - 0.03) { P.feet = g; P.vy = 0; }
  else { P.vy -= 9.8 * dt; P.feet = Math.max(g, P.feet + P.vy * dt); }
  camera.position.set(P.x, P.feet + 1.62, P.z);
  document.getElementById('hud').textContent = roomAt(P.x, P.z, P.feet);
}

function updateHelp() {
  document.getElementById('help').innerHTML = S.mode === 'orbit'
    ? '<b>Drag</b> rotate · <b>right-drag</b> pan · <b>scroll</b> zoom · <b>0–3</b> floors · <b>R</b> current ⇄ renovated · click a numbered marker for details'
    : '<b>WASD</b> move · <b>mouse</b> look · <b>Shift</b> run · <b>1 2 3</b> floors · <b>R</b> current ⇄ renovated · <b>Esc</b> then Dollhouse to leave · stairs are walkable';
}

// ================================================================ loop
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight);
});
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (fly) {
    const k = Math.min(1, (performance.now() - fly.s) / (fly.dur * 1000)), e = k < .5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2;
    camera.position.lerpVectors(fly.p0, fly.p1, e); orbit.target.lerpVectors(fly.t0, fly.t1, e);
    if (k >= 1) fly = null;
  }
  if (S.mode === 'orbit') orbit.update(); else updateWalk(dt);
  renderer.render(scene, camera); labelRenderer.render(scene, camera);
  requestAnimationFrame(tick);
}
applyPalette(); applyVisibility(); updateHelp();
document.getElementById('loading').remove();
setFloor('g', false);
camera.position.set(-6.5, 12.5, 15.5); orbit.target.set(3, 0.5, 5.5);
window.__S = S; window.__api = { blocked, floorAt, setFloor, toggleVariant, enterWalk, exitWalk, selectItem, placeWalker, camera, orbit, P };
tick();
</script>
